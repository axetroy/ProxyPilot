name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---------- proxy-core (Go) ----------

      - name: Go vet
        working-directory: proxy-core
        run: go vet ./...

      - name: Go test
        working-directory: proxy-core
        run: go test ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: proxy-core
          version: v2.12.2
          args: --timeout=5m

      - name: Goreleaser cross-build (snapshot)
        # 仅在 ubuntu + node 20 组合上执行一次，避免矩阵重复
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
          workdir: proxy-core

      # ---------- app (Electron / React) ----------

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint (ESLint)
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        run: npm run build

  # ---------- 发布：proxy-core 跨平台二进制（goreleaser 创建 GitHub Release） ----------

  release:
    name: Release proxy-core
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser 需要完整 git 历史生成 changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: proxy-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 发布：桌面端安装包（electron-builder，三平台） ----------

  build-app:
    name: Build app (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app (${{ matrix.platform }})
        working-directory: app
        run: npm run dist:${{ matrix.platform }}
        env:
          # CI 无签名证书：禁用自动发现，避免 macOS 签名失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 下载 AppImage 等工具时需要 GitHub token，避免 rate limit 报错
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}