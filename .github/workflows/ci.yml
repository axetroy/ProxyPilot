name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---------- proxy-core (Go) ----------

      - name: Go vet
        working-directory: proxy-core
        run: go vet ./...

      - name: Go test
        working-directory: proxy-core
        run: go test ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: proxy-core
          version: v2.12.2
          args: --timeout=5m

      - name: Goreleaser cross-build (snapshot)
        # 仅在 ubuntu + node 20 组合上执行一次，避免矩阵重复
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
          workdir: proxy-core

      # ---------- app (Electron / React) ----------

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint (ESLint)
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        run: npm run build

  # ---------- 发布：proxy-core 跨平台二进制（goreleaser 创建 GitHub Release） ----------

  release:
    name: Release proxy-core
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser 需要完整 git 历史生成 changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: proxy-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 发布：桌面端安装包（electron-builder，平台 × 架构矩阵） ----------
  #
  # 架构交叉编译（同一系统内）：
  #   - windows: x64 runner 上分别构建 win x64 / win arm64（NSIS 支持 arm64）
  #   - linux:   x64 runner 上分别构建 linux x64 / linux arm64（AppImage 支持交叉架构）
  #   - mac:     macos runner 上构建 mac arm64 与 mac x64（Apple Silicon 上交叉构建 x64）
  # proxy-core 二进制由各 dist:* 脚本按目标 GOOS/GOARCH 交叉编译，
  # 保证打包进安装包的二进制与目标架构一致。

  build-app:
    name: Build app (${{ matrix.platform }}-${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    # 依赖 release job 先完成：goreleaser 负责创建 GitHub Release，各 build-app
    # job 的 softprops/action-gh-release 只往已存在的 Release 上传。若并行执行，
    # softprops 在 release 尚未建好时会自行创建 draft，与 goreleaser 的 release
    # 互相重复（v0.1.12 日志："Creating new GitHub release" → "duplicate draft" →
    # "Removing duplicate draft"），且上传会因资产竞态而失败。
    needs: [test, release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            dist: dist:win
          - os: windows-latest
            platform: win
            arch: arm64
            dist: dist:win:arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            dist: dist:linux
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            dist: dist:linux:arm64
          - os: macos-latest
            platform: mac
            arch: arm64
            dist: dist:mac
          - os: macos-latest
            platform: mac
            arch: x64
            dist: dist:mac:x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build app (${{ matrix.platform }}-${{ matrix.arch }})
        working-directory: app
        run: npm run ${{ matrix.dist }}
        env:
          # CI 无签名证书：禁用自动发现，避免 macOS 签名失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder 下载 AppImage 等工具时需要 GitHub token，避免 rate limit 报错
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 更新元数据统一命名为「平台-架构」格式（windows-x64.yml / windows-arm64.yml /
      # linux-x64.yml / darwin-x64.yml / darwin-arm64.yml），与 app/electron/main/updater.ts
      # 中 patch 过的 electron-updater 默认文件名一致（见 patches/electron-updater+6.8.9.patch）。
      # electron-builder 构建端不区分 Windows/macOS 架构（统一生成 latest.yml /
      # latest-mac.yml），Linux 区分但命名不同（latest-linux.yml / latest-linux-arm64.yml），
      # 这里统一改名（mv，不保留旧命名文件），避免多个架构 job 上传同名文件互相覆盖
      # （v0.1.11 事故：Windows 的 latest.yml 被 win-arm64 job 覆盖，x64 用户下载到 arm64
      # 安装包，安装器不解压任何文件却先卸载旧版，应用直接消失）。
      - name: Publish update metadata windows-x64.yml (win-x64)
        if: matrix.platform == 'win' && matrix.arch == 'x64'
        working-directory: app
        shell: bash
        run: mv release/latest.yml release/windows-x64.yml

      - name: Publish update metadata windows-arm64.yml (win-arm64)
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        working-directory: app
        shell: bash
        run: mv release/latest.yml release/windows-arm64.yml

      - name: Publish update metadata linux-x64.yml (linux-x64)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        working-directory: app
        run: mv release/latest-linux.yml release/linux-x64.yml

      - name: Publish update metadata linux-arm64.yml (linux-arm64)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        working-directory: app
        run: mv release/latest-linux-arm64.yml release/linux-arm64.yml

      - name: Publish update metadata darwin-x64.yml (mac-x64)
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        working-directory: app
        run: mv release/latest-mac.yml release/darwin-x64.yml

      - name: Publish update metadata darwin-arm64.yml (mac-arm64)
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        working-directory: app
        run: mv release/latest-mac.yml release/darwin-arm64.yml

      # electron-builder 每个 job 都会生成 builder-debug.yml（构建配置转储，无发布
      # 价值）与 checksums.txt（仅含该 job 自身产物的校验和，发布级不完整）。
      # 若不删除，6 个并行 job 上传同名资产会互相覆盖/删除（v0.1.12 的 linux-x64
      # job 即在 builder-debug.yml 上传竞态中失败），因此上传前统一清理。
      - name: Remove non-release artifacts (builder-debug.yml / checksums.txt)
        working-directory: app
        run: rm -f release/builder-debug.yml release/checksums.txt

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}