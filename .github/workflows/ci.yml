name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proxy-core/go.mod
          cache-dependency-path: proxy-core/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---------- proxy-core (Go) ----------

      - name: Go vet
        working-directory: proxy-core
        run: go vet ./...

      - name: Go test
        working-directory: proxy-core
        run: go test ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: proxy-core
          version: v2.12.2
          args: --timeout=5m

      # ---------- app (Electron / React) ----------

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        run: npm run build